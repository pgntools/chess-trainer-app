name: CI

# The build + lint + test gate, closed by a machine rather than by whoever
# remembers to run `yarn build` or `yarn lint` locally. `development` is the
# integration branch every feature PR targets, so it is the one push trigger
# worth having. The browser accessibility pass is its own workflow
# (a11y.yml, CTA-116): it needs Chromium and a production build of its own.
#
# Every check is its own job, and they run side by side (CTA-123): the build,
# lint, and the test groups of `vite.config.ts`'s `test.projects` — `unit` in
# one job, `ui` split over three (`vitest --shard`). The third group,
# `gallery` — the gallery's axe matrix, every page under every theme, half an
# hour of tests — is not in this gate: nightly.yml runs it.
#
# Coverage is measured on a push to `development` (and nightly), not on a pull
# request: there the tests run once, in one job, with `--coverage`.
on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

# A new push to a pull request's branch makes its running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the Node the reference workflows pin. This repo pins nothing
          # in-tree (no .nvmrc, no engines) — local dev Node comes from fnm.
          node-version: 25
          cache: yarn
      - run: yarn install --frozen-lockfile
      # `tsc -b` over the app *and* the tests, then the production build.
      - run: yarn build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: yarn
      - run: yarn install --frozen-lockfile
      # A gate (CTA-116). It carries what nothing else enforces once a change
      # is out of its author's hands: the design system's tier import rules,
      # the MUI lock (no screen or block imports an atom the design system
      # wraps) and `eslint-plugin-jsx-a11y`. It exits 0 on the whole tree.
      - run: yarn lint
      # No test file under src/ is outside every test group, or in two: a file
      # no group's glob matches would never run anywhere (CTA-123).
      - run: yarn test:groups

  unit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit

  ui:
    if: github.event_name != 'push'
    name: ui (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not hide the others'.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The runner has four cores; `--maxWorkers 3` leaves one to Vitest itself.
      - run: yarn test:ui --shard=${{ matrix.shard }}/3

  # On a push to `development`: the pull-request gate's tests (`unit` and `ui`)
  # once more, in one job, with coverage. `--coverage` is a readout, not a
  # gate: vite.config.ts has a coverage block but no thresholds, so the numbers
  # are reported without failing CI. Add thresholds there if the team wants it
  # enforced.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:run --coverage
