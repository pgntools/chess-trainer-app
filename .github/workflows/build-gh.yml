# build-gh — builds the site for GitHub Pages and deploys it there:
# https://pgntools.github.io/chess-trainer-app/ (CTA-136; deploy-pages.yml until
# then). Its twin, build-swa.yml, deploys the same site to chessapp.dev — the
# canonical host every page names (docs/static-pages-proposal.md §10).
#
# THE NAME IS A CONTRACT: release.yml's publish-pages job dispatches this
# workflow by its `name:`, "Deploy to GitHub Pages". Rename both together.
#
# Two triggers, each for a different reason:
#
#   push (main, filtered) — the ordinary path. A merged PR that touched the
#     app republishes the site.
#   workflow_dispatch     — everything else. release.yml's publish-pages job
#     fires exactly this trigger with --ref main (a GITHUB_TOKEN push emits no
#     workflow runs, so the `push` trigger never sees the release's version
#     bump), and it is also how a human re-runs or recovers a deploy.
#
# THE REF IS THE WHOLE POINT, and it is why this is not a `workflow_call`: a
# called workflow runs in the caller's context, so `github.ref` would stay
# `refs/pull/<n>/merge` from release.yml's pull_request trigger, and the
# `github-pages` environment only allows `main`. A dispatch creates its own
# run at `refs/heads/main`. (The build itself is a called workflow,
# build.yml: only the deploy job needs the environment.)
#
# GitHub Pages serves no SPA fallback and no redirects: the build writes
# 404.html — the app's template, which boots the app at any address no page
# is written for (a reader's record), with status 404 — and a refresh page at
# each of the Blog's old addresses. It cannot serve robots.txt or a sitemap
# (a project site's would sit at the user site's root); build-swa.yml's host
# does.
#
# PRECONDITION, not fixable from this repository: Settings -> Pages -> Build
# and deployment -> Source must be "GitHub Actions". Until a human does that,
# actions/deploy-pages fails with "Get Pages site failed".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "plugins/**"
      - "index.html"
      - "package.json"
      - "yarn.lock"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-gh.yml"
  workflow_dispatch:

# Serialize deploys without cancelling one in flight: a half-deployed Pages
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    uses: ./.github/workflows/build.yml
    with:
      deploy_target: gh
      base_path: /chess-trainer-app/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
